{{ if .IsHome }}
<style>
/* Homepage honors: scoped to preserve every other section and theme. */
#honors { scroll-margin-top: 5rem; }
#honors .prose { max-width: 64rem; width: 100%; }
#honors .honors-content { width: 100%; }
#honors .honors-highlights,
#honors .honors-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 1.25rem; }
#honors .honors-highlights { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 2rem; }
#honors .honors-highlights li { border: 1px solid #d1e5dd; border-top: 3px solid #047857; border-radius: .5rem; padding: 1.25rem; margin: 0; background: #f6faf8; }
#honors .honor-title { display: block; font-size: 1rem; font-weight: 650; line-height: 1.5; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
#honors .honor-title:hover { color: #047857; text-decoration: underline; text-underline-offset: .2em; }
#honors .honor-title:focus-visible { outline: 2px solid #059669; outline-offset: 4px; }
#honors .honor-detail { display: block; margin-top: .4rem; font-size: .875rem; line-height: 1.6; color: #4b5563; overflow-wrap: anywhere; }
#honors .honors-list { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 2rem; }
#honors .honors-list li { border-top: 1px solid #e5e7eb; padding-top: 1rem; margin: 0; }
.dark #honors .honors-highlights li { background: #102b25; border-color: #365b4e; border-top-color: #34d399; }
.dark #honors .honor-detail { color: #c1cbc7; }
.dark #honors .honors-list li { border-color: #374151; }
.dark #honors .honor-title:hover { color: #6ee7b7; }
@media (max-width: 639px) {
  #honors .honors-highlights, #honors .honors-list { grid-template-columns: minmax(0, 1fr); }
  #honors .honors-highlights li { padding: 1rem; }
}
</style>
{{ end }}
